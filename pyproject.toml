[project]
name = "tia-moteur"
version = "0.1.0"
description = "Agent Pydantic AI capable d'utiliser des outils locaux."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic-ai-slim[openai]>=1.0,<2.0",
    "pydantic-settings>=2.10,<3.0",
    "python-dotenv>=1.2,<2.0",
    "pyyaml>=6.0,<7.0",
]

[project.scripts]
tia = "tia_moteur.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.4,<10.0",
    "pytest-asyncio>=1.1,<2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tia_moteur"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
asyncio_mode = "auto"
